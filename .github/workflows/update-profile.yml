name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *" # every night, 00:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        run: node scripts/generate.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Add a PAT as repo secret GH_PAT to count private contributions (see README notes)
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: redraw profile cards" && git push)
